services:
  postgres:
    build: .docker/db
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - .docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data: