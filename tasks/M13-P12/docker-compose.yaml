name: thepower-m13-p12

services:
  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: thepower
      POSTGRES_USER: thepower
      POSTGRES_PASSWORD: thepower
      MODEL_EMBEDDING_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      HF_HOME: /models
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./.docker/app/documents:/code/documents:ro
      - embedding_models:/models
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: thepower
      POSTGRES_USER: thepower
      POSTGRES_PASSWORD: thepower
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/db/dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thepower -d thepower"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  embedding_models:
