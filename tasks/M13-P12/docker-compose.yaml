name: thepower-course-m13-p12

services:
  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: thepower
      POSTGRES_USER: thepower
      POSTGRES_PASSWORD: thepower
      TABLE_NAME_DOCUMENTS: documents
      TABLE_NAME_CHUNKS: document_chunks
      MODEL_RERANKER_NAME: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
      MODEL_EMBEDDING_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      MODEL_EMBEDDING_DIMENSIONS: 384
      HF_HOME: /models
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: thepower
      MINIO_SECRET_KEY: thepower-minio
      MINIO_BUCKET: chat-files
      # Gemini (la clave GEMINI_API_KEY va en .env, nunca en este archivo)
      MULTIMODAL_MODEL_ID: ${MULTIMODAL_MODEL_ID:-gemini-3.8-flash}
      TTS_MODEL_ID: ${TTS_MODEL_ID:-gemini-3.8-flash-lite-tts}
      TTS_VOICE: ${TTS_VOICE:-Kore}
      DEEP_RESEARCH_AGENT_ID: ${DEEP_RESEARCH_AGENT_ID:-deep-research-preview-04-2026}
      RESEARCH_MAX_REAL_RUNS: ${RESEARCH_MAX_REAL_RUNS:-1}
      RESEARCH_MAX_POLLS: ${RESEARCH_MAX_POLLS:-6}
      RESEARCH_POLL_SECONDS: ${RESEARCH_POLL_SECONDS:-10}
      AUDIO_MAX_SECONDS: ${AUDIO_MAX_SECONDS:-30}
      EVIDENCE_DIR: /code/evidence
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./.docker/app/documents:/code/documents:ro
      - embedding_models:/models
      - uploads:/code/legacy_uploads:ro
      - ./evidence:/code/evidence
      - ./inputs:/code/inputs
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thepower
      MINIO_ROOT_PASSWORD: thepower-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set health http://localhost:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" >/dev/null && mc ready health"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: thepower
      POSTGRES_USER: thepower
      POSTGRES_PASSWORD: thepower
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/db/dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thepower -d thepower"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  embedding_models:
  whisper_models:
  uploads:
  minio_data: