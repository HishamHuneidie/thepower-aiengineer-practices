name: thepower-course-m13-p12

services:
  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: thepower
      POSTGRES_USER: thepower
      POSTGRES_PASSWORD: thepower
      MODEL_EMBEDDING_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      IMAGE_MODEL_ID: gemma3:4b
      GENER_MODEL_ID: llama3.2:3b
      HF_HOME: /models
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: thepower
      MINIO_SECRET_KEY: thepower-minio
      MINIO_BUCKET: chat-files
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./.docker/app/documents:/code/documents:ro
      - embedding_models:/models
      - uploads:/code/legacy_uploads:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy

  ollama:
    build:
      context: .
      dockerfile: .docker/ollama/Dockerfile
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: thepower
      MINIO_ROOT_PASSWORD: thepower-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set health http://localhost:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" >/dev/null && mc ready health"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: thepower
      POSTGRES_USER: thepower
      POSTGRES_PASSWORD: thepower
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/db/dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thepower -d thepower"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  embedding_models:
  whisper_models:
  uploads:
  minio_data: